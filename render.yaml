services:
  - type: web
    name: weather-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MCP_TRANSPORT
        value: sse
      - key: HOST
        value: 0.0.0.0

